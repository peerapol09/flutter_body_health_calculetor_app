name: flutter_body_health_calculetor_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:                        # ใช้งาน package ที่ใช้ในการเขียน code
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2             # รวม font จาก google fonts
  font_awesome_flutter: ^11.0.0    # รวม icon จาก font awesome
  

dev_dependencies:                   # ใช้งาน package ที่ใช้ในการ test code
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

icons_launcher:
  image_path: "assets/icon/icon.png"  # เปลี่ยนชื่อให้ตรงกลับไฟล์
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/